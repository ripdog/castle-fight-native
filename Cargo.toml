[workspace]
resolver = "3"
members = [
    "crates/sim",
    "crates/sim-bench",
    "crates/debug-viewer",
    "crates/client",
    "crates/protocol",
    "crates/server",
    "crates/wc3-assets",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = { version = "0.19", default-features = false, features = ["2d"] }
bevy_ecs = { version = "0.19", default-features = false, features = ["multi_threaded"] }
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = "line-tables-only"
