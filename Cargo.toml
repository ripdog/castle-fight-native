[workspace]
resolver = "3"
members = [
    "crates/sim",
    "crates/sim-bench",
    "crates/debug-viewer",
    "crates/client",
    "crates/protocol",
    "crates/server",
    "crates/wc3-assets",
]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = { version = "0.19", default-features = false, features = ["2d"] }
bevy_ecs = { version = "0.19", default-features = false, features = ["multi_threaded"] }
bytemuck = { version = "1", features = ["derive"] }
rayon = "1.11"
constant_time_eq = "0.4"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = "line-tables-only"

# Local forks of Bevy 0.19.1 crates; see vendor/README.md for the patches and how to re-apply them.
[patch.crates-io]
bevy_light = { path = "vendor/bevy_light" }
bevy_pbr = { path = "vendor/bevy_pbr" }
bevy_render = { path = "vendor/bevy_render" }
bevy_tasks = { path = "vendor/bevy_tasks" }
bevy_transform = { path = "vendor/bevy_transform" }
bevy_world_serialization = { path = "vendor/bevy_world_serialization" }
