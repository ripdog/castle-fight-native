[build]
jobs = 6
# sccache cannot cache rustc invocations that use Cargo's incremental mode.
# Keep per-worktree target directories isolated, and let sccache provide the
# cross-build cache instead.
incremental = false

[env]
# Cargo exports these to rustc wrappers as well, so manually-invoked Cargo gets
# the same sccache policy as tools/cargo-interactive.
SCCACHE_CACHE_SIZE = { value = "32G", force = false }
# sccache's default 600-second idle timeout can expire while long rustc jobs are
# still running, disconnecting them and forcing duplicate local compilation.
SCCACHE_IDLE_TIMEOUT = { value = "0", force = false }
