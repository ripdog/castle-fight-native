[package]
name = "castle-fight-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bevy = { workspace = true, features = ["3d", "png", "ui", "custom_cursor", "bevy_audio", "flac", "vorbis", "system_clipboard"] }
bytemuck.workspace = true
castle-fight-protocol = { path = "../protocol" }
castle-fight-server = { path = "../server" }
castle-fight-sim = { path = "../sim" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["process"] }

[features]
# Opt-in per-system span tracing for the profile report (named SYSTEM CPU rows).
trace = ["bevy/trace", "bevy/debug"]
